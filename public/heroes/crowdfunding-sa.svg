  </g>
  <!-- awnings stripe -->
  <rect x="60" y="205" width="1080" height="8" fill="#F2B705"/>
  <rect x="0" y="438" width="1200" height="62" fill="#141414"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="476" font-size="20" font-weight="bold" fill="#FAFAF6" letter-spacing="1">CAPITAL</text>
    <text x="1140" y="476" text-anchor="end" font-size="15" font-weight="bold" fill="#F2B705" letter-spacing="2">CROWDFUNDING AND COMMUNITY CAPITAL</text>
  </g>
