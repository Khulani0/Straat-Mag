    <rect x="320" y="290" width="80" height="150" fill="#141414"/>
    <rect x="415" y="290" width="70" height="95" fill="#F2B705"/>

    <rect x="520" y="200" width="200" height="240" fill="#141414"/>
    <rect x="540" y="150" width="160" height="55" fill="#F2B705"/>
    <rect x="560" y="285" width="70" height="155" fill="#FAFAF6"/>
