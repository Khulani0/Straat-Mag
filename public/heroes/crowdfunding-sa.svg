<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Illustration of a township high street of small shops">
  <rect width="1200" height="500" fill="#FAFAF6"/>
  <rect x="0" y="120" width="1200" height="320" fill="#F7E7A8" opacity="0.5"/>
  <!-- row of shops -->
  <g>
    <rect x="60" y="210" width="200" height="230" fill="#141414"/>
    <rect x="80" y="150" width="160" height="60" fill="#B3352C"/>
    <rect x="95" y="300" width="60" height="140" fill="#F2B705"/>
    <rect x="170" y="300" width="70" height="90" fill="#FAFAF6"/>

    <rect x="280" y="230" width="220" height="210" fill="#5C6670"/>
