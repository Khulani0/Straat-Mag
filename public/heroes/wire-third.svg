  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="60" y="140" font-size="90" fill="#FAFAF6" letter-spacing="-3">THE WIRE</text>
    <rect x="60" y="170" width="500" height="12" fill="#F2B705"/>
