<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="The Wire: a ticker of deadlines and funding news">
  <rect width="1200" height="500" fill="#141414"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="60" y="140" font-size="90" fill="#FAFAF6" letter-spacing="-3">THE WIRE</text>
    <rect x="60" y="170" width="500" height="12" fill="#F2B705"/>
    <text x="60" y="260" font-size="26" fill="#F2B705">AWIEF CLOSES 3 AUG</text>
