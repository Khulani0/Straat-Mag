<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="A scorecard on one side, a till slip on the other">
  <rect width="1200" height="500" fill="#141414"/>
  <g>
    <rect x="100" y="100" width="380" height="300" fill="none" stroke="#FAFAF6" stroke-width="3"/>
    <text x="130" y="150" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#F2B705">THE SCORECARD</text>
    <g fill="#FAFAF6" font-family="Arial, Helvetica, sans-serif" font-size="18">
      <text x="130" y="200">☐ GOVERNANCE</text>
      <text x="130" y="240">☐ INNOVATION</text>
      <text x="130" y="280">☐ IMPACT</text>
      <text x="130" y="320">☐ GROWTH</text>
      <text x="130" y="360">☐ SUSTAINABILITY</text>
    </g>
  </g>
  <g>
    <rect x="720" y="100" width="380" height="300" fill="#FAFAF6"/>
    <text x="750" y="150" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#141414">THE TILL SLIP</text>
    <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="18">
      <text x="750" y="200">PROBLEM SOLVED</text>
      <text x="750" y="240">PRICE</text>
      <text x="750" y="280">DELIVERY DAY</text>
      <text x="750" y="320" font-weight="bold">PAID</text>
    </g>
    <rect x="750" y="345" width="200" height="8" fill="#F2B705"/>
  </g>
  <text x="545" y="265" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#F2B705">VS</text>
  <text x="100" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5C6670" font-weight="bold">TWO AUDIENCES. TWO PITCHES. NEVER BLEND THEM.</text>
</svg>
