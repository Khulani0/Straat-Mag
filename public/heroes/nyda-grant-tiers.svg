<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Chart of NYDA grant tiers rising from ten thousand rand to the two hundred thousand rand cap">
  <rect width="1200" height="500" fill="#FAFAF6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="80" font-size="30" font-weight="bold" fill="#141414">NYDA GRANT TIERS</text>
    <text x="60" y="112" font-size="17" fill="#5C6670">Cumulative cap per business: R200,000. Source: NYDA</text>
    <rect x="60" y="330" width="200" height="80" fill="#141414"/>
    <text x="70" y="446" font-size="18" font-weight="bold" fill="#141414">R10k</text>
    <text x="70" y="470" font-size="14" fill="#5C6670">SURVIVALIST</text>
    <rect x="330" y="250" width="200" height="160" fill="#141414"/>
    <text x="340" y="446" font-size="18" font-weight="bold" fill="#141414">R50k</text>
    <text x="340" y="470" font-size="14" fill="#5C6670">START-UP</text>
    <rect x="600" y="170" width="200" height="240" fill="#141414"/>
    <text x="610" y="446" font-size="18" font-weight="bold" fill="#141414">R100k</text>
    <text x="610" y="470" font-size="14" fill="#5C6670">GROWTH</text>
    <rect x="870" y="90" width="200" height="320" fill="#F2B705"/>
    <text x="880" y="446" font-size="18" font-weight="bold" fill="#141414">R200k</text>
    <text x="880" y="470" font-size="14" fill="#5C6670">CUMULATIVE CAP</text>
  </g>
  <rect x="60" y="410" width="1010" height="3" fill="#141414"/>
</svg>
