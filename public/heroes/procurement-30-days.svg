<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Thirty days: the legal deadline for government to pay a valid invoice">
  <rect width="1200" height="500" fill="#141414"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="60" y="300" font-size="230" fill="#F2B705" letter-spacing="-10">30</text>
    <text x="400" y="220" font-size="72" fill="#FAFAF6" letter-spacing="2">DAYS</text>
    <text x="400" y="285" font-size="24" fill="#FAFAF6" font-weight="normal">to pay a valid invoice.</text>
    <text x="400" y="320" font-size="24" fill="#FAFAF6" font-weight="normal">That is the law, not a courtesy.</text>
    <text x="60" y="430" font-size="17" fill="#5C6670" font-weight="normal">TREASURY REGULATION 8.2.3 · PUBLIC FINANCE MANAGEMENT ACT</text>
  </g>
