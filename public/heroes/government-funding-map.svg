<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Typographic map of government funders and ticket sizes">
  <rect width="1200" height="500" fill="#141414"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <rect x="60" y="60" width="340" height="170" fill="none" stroke="#FAFAF6" stroke-width="2"/>
    <text x="85" y="115" font-size="34" fill="#F2B705">SEDFA</text>
    <text x="85" y="160" font-size="22" fill="#FAFAF6">R50k to R15m</text>
    <text x="85" y="195" font-size="16" fill="#5C6670" font-weight="normal">LOANS · SUPPORT</text>
    <rect x="430" y="60" width="340" height="170" fill="none" stroke="#FAFAF6" stroke-width="2"/>
    <text x="455" y="115" font-size="34" fill="#F2B705">NYDA</text>
    <text x="455" y="160" font-size="22" fill="#FAFAF6">Up to R200k</text>
    <text x="455" y="195" font-size="16" fill="#5C6670" font-weight="normal">GRANTS · 18 TO 35</text>
    <rect x="800" y="60" width="340" height="170" fill="none" stroke="#FAFAF6" stroke-width="2"/>
    <text x="825" y="115" font-size="34" fill="#F2B705">IDC</text>
    <text x="825" y="160" font-size="22" fill="#FAFAF6">R1m to R50m</text>
    <text x="825" y="195" font-size="16" fill="#5C6670" font-weight="normal">PRIME LESS 3%</text>
    <rect x="60" y="260" width="340" height="170" fill="none" stroke="#FAFAF6" stroke-width="2"/>
