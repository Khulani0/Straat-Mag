    <rect x="430" y="260" width="340" height="170" fill="none" stroke="#FAFAF6" stroke-width="2"/>
    <text x="455" y="315" font-size="34" fill="#F2B705">PEO PELE</text>
    <text x="455" y="360" font-size="22" fill="#FAFAF6">R300m fund</text>
    <text x="455" y="395" font-size="16" fill="#5C6670" font-weight="normal">NEW · YOUTH</text>
    <rect x="800" y="260" width="340" height="170" fill="none" stroke="#FAFAF6" stroke-width="2"/>
    <text x="825" y="315" font-size="34" fill="#F2B705">TIA</text>
    <text x="825" y="360" font-size="22" fill="#FAFAF6">R137,3m seed</text>
    <text x="825" y="395" font-size="16" fill="#5C6670" font-weight="normal">TECH PROTOTYPES</text>
