<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Illustration of a university campus building with a mountain behind it">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAF6"/>
      <stop offset="1" stop-color="#EDE9DA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky3)"/>
  <!-- mountain -->
  <path d="M0 250 L220 120 L430 210 L640 100 L900 220 L1200 140 L1200 300 L0 300 Z" fill="#5C6670" opacity="0.35"/>
  <!-- lawn -->
  <rect x="0" y="360" width="1200" height="140" fill="#141414" opacity="0.06"/>
  <!-- building -->
  <g fill="#141414">
    <rect x="360" y="250" width="480" height="180"/>
    <polygon points="340,250 600,150 860,250"/>
    <rect x="340" y="425" width="520" height="12"/>
  </g>
  <!-- columns -->
  <g fill="#FAFAF6">
    <rect x="390" y="285" width="26" height="140"/>
    <rect x="450" y="285" width="26" height="140"/>
    <rect x="510" y="285" width="26" height="140"/>
    <rect x="570" y="285" width="26" height="140"/>
    <rect x="630" y="285" width="26" height="140"/>
    <rect x="690" y="285" width="26" height="140"/>
    <rect x="750" y="285" width="26" height="140"/>
  </g>
  <rect x="585" y="205" width="30" height="30" fill="#F2B705"/>
  <!-- trees -->
  <g fill="#141414">
    <rect x="150" y="330" width="14" height="90"/><circle cx="157" cy="320" r="42" fill="#141414" opacity="0.8"/>
    <rect x="1030" y="330" width="14" height="90"/><circle cx="1037" cy="320" r="42" fill="#141414" opacity="0.8"/>
  </g>
  <rect x="0" y="438" width="1200" height="62" fill="#141414"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="476" font-size="20" font-weight="bold" fill="#FAFAF6" letter-spacing="1">CAPITAL</text>
    <text x="1140" y="476" text-anchor="end" font-size="15" font-weight="bold" fill="#F2B705" letter-spacing="2">CAMPUS AND YOUTH MONEY</text>
  </g>
</svg>
